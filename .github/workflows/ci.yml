name: Voice AI Bridge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run offline DSP, Ghost Tools, Barge-In & Failover tests
        run: npm test
      - name: Run deterministic frame benchmark
        run: npm run demo
